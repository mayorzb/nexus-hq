name: Nexus v1.5 paper test

# PAPER ONLY: no wallet, no keys, no trading. On main: one scan every hour.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [v15-dev, V15-dev]
    paths-ignore: ["data_v15/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-v15-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      RUGCHECK_API_KEY: ${{ secrets.RUGCHECK_API_KEY }}
      SESSION_SCANS: ${{ github.event_name == 'schedule' && '1' || '6' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 1. Automated tests (stop here if anything fails)
        run: |
          python concept_scorer_v1_4.py --selftest > legacy_selftest.log 2>&1 || (tail -30 legacy_selftest.log; exit 1)
          python -m unittest test_nexus_v15 -v

      - name: 2. Telegram test notification (not on hourly runs)
        if: github.event_name != 'schedule'
        run: python nexus_v15.py --telegram-test

      - name: 3. Paper scans + save after each
        run: |
          [ -n "$SOLANA_RPC_URL" ] || unset SOLANA_RPC_URL
          [ -n "$RUGCHECK_API_KEY" ] || unset RUGCHECK_API_KEY
          for i in $(seq 1 "$SESSION_SCANS"); do
            echo "=== scan $i of $SESSION_SCANS at $(date -u +%H:%M) UTC ==="
            bash scripts/sync_data.sh
            python nexus_v15.py || echo "scan $i failed (reported to Telegram if possible)"
            bash scripts/save_logs.sh "v1.5 paper scan $(date -u +'%Y-%m-%d %H:%M') UTC" data_v15 || echo "save failed"
            if [ "$i" -lt "$SESSION_SCANS" ]; then sleep 3600; fi
          done
