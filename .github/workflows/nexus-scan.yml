name: Nexus Scan (v1.4.2) - RETIRED

# RETIRED 6 Nov 2026 (defect D7). This workflow ran every hour but saved nothing: its save step staged
# five files in one `git add ... || true`, and four of them never existed in this repo, so nothing was
# committed and the run still showed green. It also had Telegram access, so it could send alerts that were
# recorded nowhere. Its scanning job is replaced by "Nexus v1.5 paper test".
#
# Preserved v1.4.2 records (unchanged, not deleted):
#   - github.com/mayorzb/nexus-scanner at commit 1118b3c (29 Oct 2026): shadow_log.csv, paper_trades.csv,
#     concept_log_v1_4.csv
#   - nexus-bundle.zip in this repo (15-16 Oct 2026 snapshot)
#
# No schedule, no secrets: it can only be started by hand, and then it only prints this notice.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Nexus Scan v1.4.2 is retired (6 Nov 2026). Use the 'Nexus v1.5 paper test' workflow."
