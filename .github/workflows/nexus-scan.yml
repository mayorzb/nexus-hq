name: Nexus Scan

on:
  schedule:
    - cron: "7 * * * *"          # every hour at :07 (avoids the busy :00 slot)
  workflow_dispatch:              # "Run workflow" button
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: scan
        options:
          - scan
          - telegram-setup
          - telegram-test
          - report

permissions:
  contents: write                 # lets the run save the CSV logs back to the repo

concurrency:
  group: nexus-scan               # never two runs at once (protects the CSV files)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      RUGCHECK_API_KEY: ${{ secrets.RUGCHECK_API_KEY }}
      MODE: ${{ github.event.inputs.mode || 'scan' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test
        run: python concept_scorer_v1_4.py --selftest > selftest.log 2>&1 || (tail -40 selftest.log; exit 1)

      - name: Telegram setup (prints your chat ID)
        if: env.MODE == 'telegram-setup'
        run: python concept_scorer_v1_4.py --telegram-setup

      - name: Telegram test message
        if: env.MODE == 'telegram-test'
        run: python concept_scorer_v1_4.py --telegram-test

      - name: Report
        if: env.MODE == 'report'
        run: python concept_scorer_v1_4.py --report

      - name: Recheck prices, then scan
        if: env.MODE == 'scan'
        run: |
          [ -n "$SOLANA_RPC_URL" ] || unset SOLANA_RPC_URL
          [ -n "$RUGCHECK_API_KEY" ] || unset RUGCHECK_API_KEY
          python concept_scorer_v1_4.py --recheck
          python concept_scorer_v1_4.py

      - name: Save logs to the repo
        if: env.MODE == 'scan'
        run: |
          git config user.name  "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add -f shadow_log.csv paper_trades.csv concept_log_v1_4.csv scan_health.csv spot_cache_v142.json 2>/dev/null || true
          git diff --cached --quiet && { echo "Nothing new to save."; exit 0; }
          git commit -m "scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase --quiet && git push && exit 0; sleep 5; done
          echo "Could not push the logs after 3 tries."; exit 1
